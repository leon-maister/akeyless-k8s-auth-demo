apiVersion: batch/v1
kind: Job
metadata:
  name: akeyless-retrieval-job
  namespace: akeyless-k8s-python-demo
spec:
  template:
    spec:
      serviceAccountName: akeyless-python-sa
      # 
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # 
        fsGroup: 2000
      containers:
      - name: python-app
        image: leonmaister/akeyless-k8s-python-demo:2.4-sdk
        imagePullPolicy: Always
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        # 
        securityContext:
          allowPrivilegeEscalation: false
          # 
          capabilities:
            drop:
              - ALL
          # 
          runAsNonRoot: true
          runAsUser: 1000
          # 
          readOnlyRootFilesystem: false 
      restartPolicy: Never
  backoffLimit: 2